global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# The token below is the local Compose default. If you override METRICS_TOKEN,
# update this value (or switch to credentials_file) before starting the stack.
scrape_configs:
  - job_name: durable-job-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9090"]
    authorization:
      type: Bearer
      credentials: local-metrics-token

  - job_name: durable-job-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
    authorization:
      type: Bearer
      credentials: local-metrics-token
