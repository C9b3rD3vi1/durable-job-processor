name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal tests)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit and race tests
        run: go test -race -count=1 ./...

      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://jobs:jobs@localhost:5432/jobs?sslmode=disable
        run: go test -race -count=1 ./tests/integration

      - name: Build binaries
        run: go build ./...

  containers:
    name: Container images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build all container targets
        run: |
          docker build --target api -t durable-job-api:ci .
          docker build --target worker -t durable-job-worker:ci .
          docker build --target migrate -t durable-job-migrate:ci .
          docker build --target apikey -t durable-job-apikey:ci .
